<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị — MỘC</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/site.css"></head><body class="bg-stone-50 text-stone-900"><header class="border-b p-6 flex justify-between"><a class="logo" href="/">MỘC <span>/ quản trị</span></a><button id="logout" hidden class="secondary">Đăng xuất</button></header><main class="max-w-7xl mx-auto p-6"><p id="status" role="alert" class="my-4 error"></p><form method="post" action="/api/admin/login" id="login" class="panel max-w-md mx-auto mt-12 space-y-5"><h1 class="text-2xl font-semibold">Đăng nhập Admin</h1><label>Tài khoản<input name="username" autocomplete="username" required class="field" value="admin"></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required class="field"></label><button class="button w-full" disabled>Đăng nhập</button></form><section id="dashboard" hidden><div id="metrics" class="panel row"></div><div class="flex flex-wrap justify-between items-center gap-4 my-6"><h1 class="text-3xl font-semibold">Quản lý cửa hàng</h1><button id="new-product" class="button">+ Thêm sản phẩm</button></div><div class="flex gap-3 mb-6"><button class="chip active" data-tab="products">Sản phẩm</button><button class="chip" data-tab="orders">Đơn hàng</button></div><div id="products-panel" class="panel overflow-x-auto"><table><thead><tr><th>Sản phẩm</th><th>Giá</th><th>Tồn kho</th><th>Hiển thị</th><th></th></tr></thead><tbody id="product-rows"></tbody></table></div><div id="orders-panel" hidden class="space-y-4"></div></section></main><dialog id="editor"><button id="close-editor" class="dialog-close" aria-label="Đóng">✕</button><form id="product-form" class="space-y-4"><h2 class="text-2xl font-semibold">Sản phẩm</h2><label>Tên<input name="name" required maxlength="150" class="field"></label><div class="grid grid-cols-2 gap-4"><label>Giá (VND)<input name="price" type="number" required min="0" max="100000000" step="1" class="field"></label><label>Danh mục<select name="category_id" class="field"></select></label></div><label>Mô tả<textarea name="description" maxlength="2000" class="field"></textarea></label><label>URL ảnh<input name="image_url" type="url" class="field" placeholder="https://..."></label><label class="flex gap-3"><input type="checkbox" name="is_active" checked> Hiển thị trên cửa hàng</label><p class="text-sm text-stone-500">Biến thể hiện có giữ nguyên size/màu; đặt tồn kho bằng 0 để ngừng bán.</p><div id="variants" class="space-y-3"></div><button type="button" id="add-variant" class="secondary">+ Thêm size / màu</button><p id="editor-error" role="alert" class="error"></p><button id="save-product" class="button w-full">Lưu sản phẩm</button></form></dialog><div id="toast" role="status"></div><script type="module" src="/assets/admin.js"></script></body></html>
